name: hosteday_flutter_example
description: Hosteday Flutter starter application.
publish_to: "none"

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  image_picker: ^1.2.3
  hosteday_flutter:
    path: ../
  get: ^4.7.3
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - web/firebase-config.json
    - assets/logo.png